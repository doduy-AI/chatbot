services:
  xtts_worker_1:
    build: .
    container_name: xtts_worker_1
    environment:
      - REDIS_HOST=192.168.1.35 
      - REDIS_PORT=6379
      - EXTERNAL_HOST=192.168.1.5 
      - EXTERNAL_PORT=8080 
    ports:
      - "8080:8080"
    volumes:
      - ./model:/app/model 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

