services:
  db:
    image: postgres:15-alpine
    container_name: voice-ai-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: voice-ai-db
      POSTGRES_DB: ai_voice_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine 
    container_name: redis_ai_service
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redis_data: